# Settings live in the Config Server: backend/config-repo/report-service.yml.
# This file only says who this service is and where to find them. Secrets stay in .env.
spring:
  application:
    name: report-service
  config:
    import:
      # Secrets (DB_*), when started from the repository root or this folder.
      - "optional:file:./.env[.properties]"
      - "optional:file:./backend/report_service/.env[.properties]"
      - "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true   # no Config Server = do not start half-configured
