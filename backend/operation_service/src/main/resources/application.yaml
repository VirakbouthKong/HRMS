# Settings live in the Config Server: backend/config-repo/operation-service.yml (+ -docker.yml).
# This file only says who this service is and where to find them. Secrets stay in .env.
spring:
  application:
    name: operation-service
  profiles:
    # "local-dev" (default outside Docker) disables JWT checks and trusts X-Mock-* headers.
    # Docker sets SPRING_PROFILES_ACTIVE=docker.
    active: ${SPRING_PROFILES_ACTIVE:local-dev}
  config:
    import:
      # Secrets (SPRING_DATASOURCE_*, INTERNAL_API_KEY), when started from the repository root or this folder.
      - "optional:file:./.env[.properties]"
      - "optional:file:./backend/operation_service/.env[.properties]"
      - "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true   # no Config Server = do not start half-configured
