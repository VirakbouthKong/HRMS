# CRON service. Secrets (DB_*, INTERNAL_API_KEY) come from its .env.
server:
  port: 8084

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

operation:
  service:
    # CRON calls Operation directly (not through the gateway) with the internal API key.
    base-url: http://localhost:8083

internal:
  api:
    key: ${INTERNAL_API_KEY}

app:
  reports:
    recipient: ${REPORT_RECIPIENT:hr-reports@hrms.local}
    sender: ${REPORT_SENDER:no-reply@hrms.local}
